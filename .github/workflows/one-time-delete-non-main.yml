name: One-time prune all non-main branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-delete-non-main.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches other than main
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            for (const {name} of branches) {
              if (name === 'main') continue;
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + name});
                core.info('Deleted ' + name);
              } catch (e) {
                if (e.status === 404 || (e.status === 422 && /Reference does not exist/i.test(e.message))) {
                  core.info('Already deleted ' + name);
                } else {
                  throw e;
                }
              }
            }
            const remaining = (await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100})).filter(b => b.name !== 'main');
            if (remaining.length) throw new Error('Branches remain: ' + remaining.map(b => b.name).join(','));
            core.info('Only main remains');
